<!doctype html>
<html lang="en" data-size="letter" data-theme="christmas">
<head>
<meta charset="utf-8">
<title>North Pole Escape Room</title>
<link rel="stylesheet" href="../../_brand/brand.css">
<script src="../../_brand/art/winter.js"></script>
<style>
  .page.tint { background: #F4F7F3; }
  .eyebrow { color: var(--berry); }
  .cover { align-items: center; justify-content: center; text-align: center; }
  .cover h1 { font-size: 52pt; }
  .cover h1 em { display: block; color: var(--berry); font-size: 30pt; font-weight: 500; margin-bottom: 4pt; }
  .cover .sub { font-size: 13pt; color: var(--ink-soft); margin-top: 10pt; }
  .cover .facts { display: flex; gap: 10pt; justify-content: center; margin-top: 22pt; flex-wrap: wrap; }
  .cover .facts span { background: #fff; border: 1pt solid var(--line); border-radius: 99pt; padding: 6pt 14pt; font-size: 10pt; font-weight: 500; }
  .corner { position: absolute; width: 1in; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14pt 22pt; }
  .cols h3 { color: var(--pine); margin: 0 0 5pt; }
  .cols p, .cols li { font-size: 10.6pt; }
  .cols ul, .cols ol { margin: 0 0 6pt; padding-left: 15pt; }
  .box { flex: none; background: var(--frost); border-radius: 10pt; padding: 11pt 14pt; font-size: 10.4pt; margin-top: 12pt; }
  .box b { color: var(--berry); }

  /* puzzle page */
  .pz-top { flex: none; display: flex; align-items: center; gap: 14pt; border-bottom: 1.5pt solid var(--line); padding-bottom: 8pt; margin-bottom: 12pt; }
  .pz-top .num { width: 0.62in; height: 0.62in; border-radius: 50%; background: var(--berry); color: #fff; font-family: var(--serif); font-weight: 700; font-size: 22pt; display: flex; align-items: center; justify-content: center; flex: none; }
  .pz-top h2 { font-size: 23pt; }
  .pz-top .eyebrow { margin-bottom: 2pt; }
  .story { font-family: var(--serif); font-style: italic; font-size: 11.5pt; color: var(--ink-soft); margin-bottom: 10pt; }
  .task { font-size: 11pt; margin-bottom: 10pt; }
  .answer { flex: none; margin-top: auto; display: flex; align-items: center; gap: 12pt; background: var(--frost); border-radius: 10pt; padding: 10pt 14pt; font-size: 11pt; }
  .answer .lbox { width: 0.55in; height: 0.55in; border: 2pt solid var(--ink); border-radius: 6pt; background: #fff; flex: none; }
  .blank { display: inline-block; border-bottom: 1.3pt solid var(--ink); min-width: 0.7in; height: 16pt; vertical-align: bottom; }
  .keystrip { flex: none; display: grid; grid-template-columns: repeat(13, 1fr); border: 1pt solid var(--line); border-radius: 6pt; overflow: hidden; margin-top: 6pt; background: #fff; }
  .keystrip div { text-align: center; font-size: 9pt; padding: 3pt 0; border-right: 1pt solid var(--line); border-bottom: 1pt solid var(--line); }
  .keystrip div b { display: block; font-family: var(--serif); font-size: 12pt; }
  .keystrip div:nth-child(13n) { border-right: 0; }
  .keytitle { flex: none; font-size: 8.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-top: 10pt; }

  /* P1 equations */
  .eq { flex: none; display: flex; align-items: center; justify-content: center; gap: 12pt; font-family: var(--serif); font-size: 28pt; font-weight: 600; margin: 6pt 0; }
  .eq > svg { width: 0.72in; height: 0.72in; }
  .eq .q { color: var(--berry); }

  /* P2 shift cipher */
  .abc { flex: none; display: grid; grid-template-columns: repeat(26, 1fr); border: 1.3pt solid var(--ink); border-radius: 6pt; overflow: hidden; margin: 4pt 0 14pt; }
  .abc div { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 12pt; padding: 5pt 0; border-right: 0.75pt solid var(--line); background: #fff; }
  .abc div:last-child { border-right: 0; }
  .radio { flex: none; display: flex; flex-wrap: wrap; gap: 22pt 20pt; justify-content: center; background: #fff; border: 1.5pt solid var(--pine); border-radius: 12pt; padding: 26pt 14pt; margin-top: 6pt; }
  .rword { display: flex; gap: 3pt; }
  .rch { display: flex; flex-direction: column; align-items: center; gap: 4pt; }
  .rch b { font-family: var(--serif); font-size: 27pt; color: var(--pine); }
  .rch i { width: 0.4in; height: 0.5in; border-bottom: 1.5pt solid var(--ink); }
  .example { flex: none; display: flex; gap: 18pt; justify-content: center; font-size: 11pt; margin-bottom: 12pt; }
  .example span { background: var(--frost); border-radius: 99pt; padding: 4pt 12pt; }

  /* P3 maze */
  .maze { display: flex; justify-content: center; flex: 1; min-height: 0; }
  .maze > svg { height: 100%; max-width: 100%; }

  /* P4 scramble */
  .scr { flex: none; display: grid; grid-template-columns: 1.6in 1fr; gap: 12pt 14pt; align-items: center; }
  .scr .s { font-family: var(--serif); font-weight: 700; font-size: 18pt; letter-spacing: .12em; color: var(--pine); }
  .scr .clue { font-size: 10.3pt; color: var(--ink-soft); }
  .boxes { display: flex; gap: 4pt; margin-top: 3pt; }
  .boxes i { width: 0.4in; height: 0.4in; border: 1.3pt solid var(--ink); border-radius: 4pt; background: #fff; }
  .boxes i.first { background: #F3D3CF; }

  /* P5 logic grid */
  .clues { flex: none; margin: 0 0 6pt; padding-left: 16pt; }
  .clues li { font-size: 11pt; margin-bottom: 5pt; }
  table.lg { flex: none; border-collapse: collapse; margin: 10pt auto; }
  table.lg td, table.lg th { border: 1pt solid var(--ink-soft); width: 0.95in; height: 0.5in; text-align: center; font-size: 10.5pt; background: #fff; }
  table.lg th { background: var(--frost); font-weight: 500; }
  table.lg th.rh { width: 0.9in; }
  .elves { flex: none; display: flex; justify-content: center; gap: 22pt; margin: 2pt 0 8pt; }
  .elves div { text-align: center; font-size: 9pt; color: var(--ink-soft); }
  .elves div > svg { width: 0.55in; height: 0.55in; display: block; margin: 0 auto 2pt; }

  /* P6 spot the difference */
  .scene { flex: none; width: 64%; margin-left: auto; margin-right: auto; border: 1.5pt solid var(--ink); border-radius: 8pt; overflow: hidden; margin-bottom: 8pt; }
  .scene > svg { display: block; width: 100%; }

  /* P7 sudoku */
  .sud { flex: none; display: grid; grid-template-columns: repeat(4, 1.05in); grid-template-rows: repeat(4, 1.05in); border: 2.5pt solid var(--ink); margin: 6pt auto; background: #fff; }
  .sud > div { border: 0.75pt solid #B7C4BE; display: flex; align-items: center; justify-content: center; }
  .sud > div:nth-child(4n+2) { border-right: 2.5pt solid var(--ink); }
  .sud > div:nth-child(n+5):nth-child(-n+8) { border-bottom: 2.5pt solid var(--ink); }
  .sud > div.shade { background: #F3D3CF; }
  .sud > div > svg { width: 0.72in; height: 0.72in; }
  .symkey { flex: none; display: flex; justify-content: center; gap: 18pt; margin-top: 8pt; }
  .symkey div { display: flex; align-items: center; gap: 6pt; font-family: var(--serif); font-size: 16pt; font-weight: 700; }
  .symkey div > svg { width: 0.45in; height: 0.45in; }

  /* P8 patterns */
  .pat { flex: none; display: flex; align-items: center; gap: 12pt; font-family: var(--serif); font-size: 24pt; font-weight: 600; margin: 6pt 0 12pt; }
  .pat b { color: var(--berry); width: 0.45in; }
  .pat span { width: 0.78in; height: 0.6in; border: 1.3pt solid var(--line); border-radius: 8pt; display: flex; align-items: center; justify-content: center; background: #fff; }
  .pat span.q { border: 2pt dashed var(--berry); }

  /* P9 word search */
  .ws { flex: none; display: grid; border: 2pt solid var(--ink); margin: 2pt auto 10pt; background: #fff; }
  .ws i { font-style: normal; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 700; border: 0.5pt solid #DCE5E0; }
  .wlist { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3pt 10pt; font-size: 10.5pt; font-weight: 500; margin-bottom: 6pt; }
  .wlist span::before { content: ""; display: inline-block; width: 9pt; height: 9pt; border: 1.2pt solid var(--ink); border-radius: 2pt; margin-right: 6pt; vertical-align: -1pt; }
  .leftover { flex: none; display: flex; gap: 3pt; flex-wrap: wrap; justify-content: center; margin: 4pt 0 8pt; }
  .leftover i { width: 0.34in; height: 0.38in; border-bottom: 1.5pt solid var(--ink); }

  /* P10 mirror */
  .window { flex: none; margin: 4pt auto 12pt; width: 6in; background: #24453C; border: 10pt solid #fff; outline: 1.5pt solid var(--ink); border-radius: 10pt; padding: 26pt 22pt; position: relative; }
  .window .mir { transform: scaleX(-1); color: #fff; font-family: var(--serif); font-weight: 700; font-size: 30pt; line-height: 1.35; text-align: center; letter-spacing: .06em; }
  .window .fl { position: absolute; width: 0.45in; }
  .copy { flex: none; display: flex; flex-direction: column; gap: 14pt; margin: 6pt 0; }
  .copy i { display: block; border-bottom: 1.3pt solid var(--ink); height: 22pt; }

  /* lock sheet */
  .lock { flex: none; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6pt; margin: 12pt 0; }
  .lock div { text-align: center; }
  .lock i { display: block; height: 0.8in; border: 2.5pt solid var(--ink); border-radius: 9pt; background: #fff; }
  .lock span { font-size: 8pt; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; }
  .tick { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4pt 18pt; font-size: 10.5pt; }
  .tick div { display: flex; gap: 8pt; align-items: center; padding: 4pt 0; border-bottom: 1pt solid var(--line); }
  .tick i { width: 12pt; height: 12pt; border: 1.3pt solid var(--ink); border-radius: 3pt; background: #fff; flex: none; }

  /* story + cut cards */
  .halves { flex: 1; display: grid; grid-template-rows: 1fr 1fr; border: 0.75pt dashed #A9B8B1; }
  .halves > div { border: 0.75pt dashed #A9B8B1; padding: 16pt 24pt; display: flex; flex-direction: column; }
  .halves p { font-family: var(--serif); font-size: 13pt; line-height: 1.48; }
  .grid10 { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr); border: 0.75pt dashed #A9B8B1; }
  .grid10 > div { border: 0.75pt dashed #A9B8B1; padding: 10pt 14pt; display: flex; flex-direction: column; justify-content: center; }
  .grid10 .t { font-family: var(--serif); font-weight: 600; font-size: 12pt; color: var(--pine); margin-bottom: 4pt; }
  .grid10 p { font-size: 9.8pt; margin: 0; }
  .labels { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(6, 1fr); gap: 9pt; }
  .labels > div { border: 1.5pt solid var(--ink); border-radius: 12pt; display: flex; align-items: center; gap: 12pt; padding: 0 16pt; background: #fff; }
  .labels .n { font-family: var(--serif); font-weight: 700; font-size: 28pt; color: var(--berry); width: 0.6in; text-align: center; flex: none; }
  .labels b { font-family: var(--serif); font-size: 13.5pt; display: block; }
  .labels span span { font-size: 9pt; color: var(--ink-soft); }
  .badges { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); border: 0.75pt dashed #A9B8B1; }
  .badges > div { border: 0.75pt dashed #A9B8B1; padding: 12pt; display: flex; }
  .badge { flex: 1; border: 2pt solid var(--pine); border-radius: 14pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8pt; background: #fff; }
  .badge .top { background: var(--pine); color: #fff; border-radius: 99pt; padding: 3pt 12pt; font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
  .badge h3 { font-size: 15pt; margin: 6pt 0 2pt; }
  .badge .ic { height: 0.7in; margin: 6pt auto 2pt; display: flex; justify-content: center; }
  .badge .ic > svg { height: 100%; width: auto; }
  .badge .nm { width: 80%; border-bottom: 1.3pt solid var(--ink); height: 20pt; }
  .badge small { font-size: 8pt; color: var(--ink-soft); margin-top: 3pt; }

  .key2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt 20pt; }
  .key2 > div { font-size: 9.8pt; border-bottom: 1pt solid var(--line); padding-bottom: 7pt; }
  .key2 b.l { font-family: var(--serif); font-size: 15pt; color: var(--berry); margin-right: 6pt; }
  .key2 .mini > svg { width: 100%; height: auto; display: block; margin-top: 4pt; }
  table.lgmini { border-collapse: collapse; margin-top: 5pt; font-size: 9pt; }
  table.lgmini th, table.lgmini td { border: 0.75pt solid var(--line); padding: 2pt 8pt; text-align: left; }
  table.lgmini th { background: var(--frost); font-weight: 500; }
  .sudmini { display: grid; grid-template-columns: repeat(4, 0.34in); margin-top: 5pt; border: 1.5pt solid var(--ink); width: max-content; }
  .sudmini i { height: 0.34in; border: 0.5pt solid #B7C4BE; display: flex; align-items: center; justify-content: center; }
  .sudmini i.sh { background: #F3D3CF; }
  .sudmini i > svg { width: 0.26in; height: 0.26in; }
  .wsmini { display: grid; margin-top: 5pt; border: 1.2pt solid var(--ink); width: max-content; }
  .wsmini i { font-style: normal; width: 0.22in; height: 0.22in; font-size: 8pt; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 700; color: #9AA9A2; }
  .wsmini i.w { background: #DCEBE4; color: var(--pine); }
  .wsmini i.lo { background: #F3D3CF; color: var(--berry); }

  .sign { align-items: center; justify-content: center; text-align: center; border: 12pt solid var(--pine); }
  .sign h1 { font-size: 58pt; line-height: 1.02; }
  .cert { align-items: center; justify-content: center; text-align: center; border: 10pt solid var(--frost); }
  .cert .frame { flex: 1; width: 100%; border: 2pt solid var(--berry); border-radius: 14pt; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24pt; }
  .cert h1 { font-size: 42pt; }
  .cert .line { width: 4.5in; border-bottom: 1.5pt solid var(--ink); height: 40pt; margin: 10pt auto 4pt; }
</style>
</head>
<body>
<div id="pages"></div>
<script>
(function () {
  const A = window.WINTER, C = A.C;
  const out = [];
  const N = 10;
  const CODE = 'SNOWFLAKES';
  const foot = (label) => `<div class="pf"><span>North Pole Escape Room · ${label}</span><span>© 2026 Pantry Printable Co. · personal use only</span></div>`;
  const head = (title, eyebrow) => `<div class="ph"><h2>${title}</h2><span class="eyebrow">${eyebrow}</span></div>`;
  const pzTop = (n, title, sub) => `<div class="pz-top"><div class="num">${n}</div><div><div class="eyebrow">Puzzle ${n} of ${N} · ${sub}</div><h2>${title}</h2></div></div>`;
  const answer = (n, text) => `<div class="answer"><div class="lbox"></div><div><b>Letter ${n} of the launch code.</b> ${text}</div></div>`;
  const keystrip = () => `<div class="keytitle">Elf number code</div><div class="keystrip">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l, i) => `<div><b>${l}</b>${i + 1}</div>`).join('')}</div>`;
  let seed = 1224;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const nest = (svg, x, y, w, h) => svg.replace('<svg ', `<svg x="${x}" y="${y}" width="${w}" height="${h || w}" `);
  const TITLES = ['Cookie Count', 'Elf Radio', 'The Snowy Forest', 'Mixed-Up Workshop', 'Who Opened the Gate?', 'Spot the Difference', 'Toy Shelf Grid', 'What Comes Next?', 'Workshop Word Search', 'The Frosty Window'];
  window.CHECK = {};

  // ---------- 1. cover
  out.push(`<section class="page tint cover">
    <div class="corner" style="top:.5in;left:.5in;width:.9in">${A.snowflake()}</div>
    <div class="corner" style="top:.5in;right:.55in;width:.8in">${A.ornament()}</div>
    <div class="corner" style="bottom:.55in;left:.55in;width:1.1in">${A.gift({ color: C.pine })}</div>
    <div class="corner" style="bottom:.5in;right:.5in;width:1.1in">${A.holly()}</div>
    <div style="width:4.4in;margin:0 auto 10pt">${A.sleigh()}</div>
    <div class="eyebrow">Printable family escape room · ages 8+</div>
    <h1 style="margin-top:8pt"><em>The North Pole</em>Escape Room</h1>
    <div class="sub">The sleigh won’t launch! Crack 10 workshop puzzles and find the launch code before Christmas Eve.</div>
    <div class="facts"><span>10 puzzles</span><span>60–90 minutes</span><span>2–10 players</span><span>Host guide + answer key</span></div>
  </section>`);

  // ---------- 2-3. host guide
  out.push(`<section class="page">${head('Host guide', 'Read before you play')}
    <div class="cols">
      <div><h3>The story</h3><p>A snowstorm scrambled the memory of the sleigh’s launch computer, and now the sleigh won’t take off. Luckily, Juniper, the Chief Sleigh Engineer, hid a backup copy of the 10-letter launch code inside 10 puzzles around the workshop. Your players are the new elf crew. Each puzzle they solve gives them one letter of the code. When all 10 letters are on the Launch Panel, they say the code to you and the sleigh is ready to fly.</p>
        <h3 style="margin-top:10pt">Who it’s for</h3><p>Families and groups, ages 8 and up. Kids 6–7 can play on a team with an older helper. Plan on 60–90 minutes. Play as one big team or race two teams (print one set per team).</p></div>
      <div><h3>What you need</h3><ul><li>This file, printed (pages 4–19; one set per team)</li><li>12 envelopes (or folders) and tape</li><li>Pencils; scissors for the host</li><li>A small treat or a gift to “launch” at the end</li><li>Optional: a timer, a small mirror (puzzle 10), and a box that closes as the “sleigh”</li></ul>
        <h3 style="margin-top:10pt">Printing</h3><p>Print at “Actual size”. Color is best (puzzles 6 and 7 use colors), but black and white also works.</p></div>
    </div>
    <div class="box"><b>Set-up (about 20 minutes).</b>
      <ol style="margin:6pt 0 0;padding-left:15pt"><li>Cut out the envelope labels (page 17) and stick one on each envelope.</li>
      <li>Put each puzzle page (pages 6–15) in the envelope with its number. Put the Launch Panel (page 5) in the START envelope.</li>
      <li>Hide envelopes 1–10 around the room or the house. Keep the START envelope and the story card (page 4) with you.</li>
      <li>Cut out the hint cards (page 16) and keep them in your pocket.</li>
      <li>Put the treat or gift in the “sleigh” with the FINALE half of the story card.</li>
      <li>Optional: hang the door sign (page 19) and hand out the elf badges (page 18).</li></ol></div>
    ${foot('Host guide')}</section>`);
  out.push(`<section class="page">${head('Host guide', 'Running the game')}
    <div class="cols">
      <div><h3>How to play</h3><ol><li>Gather the crew, hand out elf badges and read Juniper’s message aloud (page 4, top half).</li><li>Hand over the START envelope and say “Go!” Start a 60-minute timer if you like.</li><li>Players find the envelopes and solve the puzzles in any order. Each puzzle tells them which letter of the code they found (letter 1, letter 2 and so on).</li><li>They write each letter in its box on the Launch Panel.</li><li>When all 10 boxes are full, they read the code to you. If it’s right, they open the sleigh and you read the FINALE.</li></ol>
        <h3 style="margin-top:10pt">Teams</h3><p>Racing two teams? Give each team its own printed set and hide the envelopes in two different rooms. First team to launch wins.</p></div>
      <div><h3>Hints</h3><p>Every puzzle has a hint card. A good rule: a team can ask for a hint after 5 minutes on one puzzle, or trade a hint for a silly task (sing a line of a carol, do 10 reindeer jumps).</p>
        <h3 style="margin-top:10pt">Making it easier</h3><ul><li>Don’t hide the envelopes; lay them out on the table.</li><li>Tell younger players the code is a word for something cold that falls from the sky.</li><li>Work through puzzles 2 and 5 together, out loud.</li></ul>
        <h3 style="margin-top:10pt">Making it harder</h3><ul><li>Set a 45-minute timer.</li><li>Hide envelopes inside each other: envelope 2 is only found after solving 1, and so on.</li><li>No hint cards, or only three for the whole game.</li></ul></div>
    </div>
    <div class="box"><b>Answers are on pages 20–21.</b> Keep those pages (and the hint cards) away from the players. Each puzzle can also be checked on its own: its letter goes in the box at the bottom of the puzzle page.</div>
    ${foot('Host guide')}</section>`);

  // ---------- 4. story card
  out.push(`<section class="page">${head('Story cards', 'Host reads aloud · cut in half')}
    <div class="halves">
      <div><div class="eyebrow" style="margin-bottom:6pt">Read first</div>
        <p>Attention, new elf crew!</p>
        <p>This is Juniper, Chief Sleigh Engineer. Last night’s snowstorm scrambled the sleigh’s launch computer, and it has forgotten its 10-letter launch code. No code, no take-off, and Christmas Eve is coming fast!</p>
        <p>I hid a backup of the code in 10 puzzles around the workshop. Each one gives you one letter. Solve them in any order, write each letter on the Launch Panel, and tell me the code. I’m counting on you.</p>
        <p style="margin-top:auto">Warm mittens and good luck,<br><b>Juniper</b></p></div>
      <div><div class="eyebrow" style="margin-bottom:6pt">Read at the end</div>
        <p>Launch code accepted: <b>SNOWFLAKES</b>! The lights are blinking, the bells are jingling, and the sleigh is ready to fly.</p>
        <p>I picked that code for a reason. No two snowflakes are the same, and no two elves are either. Each of you solved something the others couldn’t, and together you saved Christmas Eve. Please enjoy your reward from the sleigh.</p>
        <p style="margin-top:auto">With thanks from the whole workshop,<br><b>Juniper</b></p></div>
    </div>${foot('Story cards')}</section>`);

  // ---------- 5. launch panel
  out.push(`<section class="page tint">${head('The Launch Panel', 'Start here')}
    <p class="story">The sleigh needs a 10-letter launch code. Find the 10 envelopes, solve each puzzle and write its letter in the matching box.</p>
    <div class="lock">${Array.from({ length: N }, (_, i) => `<div><i></i><span>Letter ${i + 1}</span></div>`).join('')}</div>
    <p class="task" style="text-align:center">When every box is full, read the code out loud to your host.</p>
    <h3 style="margin:8pt 0 6pt">Puzzle checklist</h3>
    <div class="tick">${TITLES.map((t, i) => `<div><i></i>${i + 1} · ${t}</div>`).join('')}</div>
    <div style="display:flex;justify-content:center;align-items:flex-end;gap:18pt;margin-top:auto"><div style="width:1in">${A.tree()}</div><div style="width:2.4in">${A.sleigh()}</div><div style="width:.8in">${A.gift()}</div></div>
    ${foot('Launch Panel')}</section>`);

  // ---------- P1 cookie count: gift=6, bell=4, star=5 -> 6*4-5 = 19 = S

      <div><b class="l">4 = W</b>WREATH, ICICLE, NORTH, TRAIN, ELVES, REINDEER. The shaded letters spell WINTER. First letter: W.</div>
      <div><b class="l">5 = F</b>Clue 1: Ruby wraps. Clue 2: Milo isn’t on reindeer or painting, so Milo bakes. Clue 3: Pip isn’t on reindeer, so Pip paints. Fern feeds the reindeer: F.<table class="lgmini">${names.map((n, i) => `<tr><th>${n}</th><td>${['Reindeer', 'Baking', 'Painting', 'Wrapping'][i]}</td></tr>`).join('')}</table></div>
    </div>
    <div class="box" style="font-size:12pt;text-align:center"><b>The launch code:</b> <span style="font-family:var(--serif);font-size:20pt;font-weight:700;letter-spacing:.2em">${CODE.split('').join(' ')}</span></div>
    ${foot('Answer key')}</section>`);
  out.push(`<section class="page">${head('Answer key', 'Host only · puzzles 6–10')}
    <div class="key2">
      <div><b class="l">6 = L</b>6 differences: the moon, one snowflake and the candy cane are missing; the snowman’s scarf is green; the left gift is gold; a mitten is lying in the snow. 6 × 2 = 12, and 12 = L.<div class="mini" style="width:2.9in">${((sv, add) => sv.slice(0, sv.lastIndexOf('</svg>')) + add + '</svg>')(scene(true), [[540, 52, 32], [375, 59, 24], [305, 199, 28], [198, 244, 38], [424, 226, 44], [401, 262, 28]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#E0453A" stroke-width="5"/>`).join(''))}</div></div>
      <div><b class="l">7 = A</b>The shaded square (row 3, column 2) is the tree, and tree = A.<div class="sudmini">${sud.flatMap((r, y) => r.map((v, x) => `<i class="${y === SH[0] && x === SH[1] ? 'sh' : ''}">${sym[v]}</i>`)).join('')}</div></div>
      <div><b class="l">8 = K</b>A = 20, B = 16, C = 25. 20 + 16 − 25 = 11, and 11 = K.</div>
      <div><b class="l">9 = E</b>The leftover (pink) letters read LETTER NINE IS E.${wsMini}</div>
      <div><b class="l">10 = S</b>The window says THE TENTH AND LAST LETTER OF THE CODE IS S.</div>
    </div>
    <div class="box" style="font-size:12pt;text-align:center"><b>The launch code:</b> <span style="font-family:var(--serif);font-size:20pt;font-weight:700;letter-spacing:.2em">${CODE.split('').join(' ')}</span></div>
    ${foot('Answer key')}</section>`);

  // ---------- 22. certificate
  out.push(`<section class="page cert"><div class="frame">
    <div style="width:2.8in">${A.sleigh()}</div>
    <div class="eyebrow" style="margin-top:8pt">Official North Pole certificate</div>
    <h1 style="margin:6pt 0">Sleigh Launched!</h1>
    <p style="font-size:13pt">This certifies that</p><div class="line"></div><p class="muted" style="font-size:9pt">name(s)</p>
    <p style="font-size:13pt;margin-top:10pt">cracked all 10 workshop puzzles and found the launch code just in time for Christmas Eve.</p>
    <p style="font-size:11pt;margin-top:10pt">Time: <span class="blank" style="min-width:1in"></span> &nbsp;&nbsp; Date: <span class="blank" style="min-width:1.3in"></span></p>
    <div style="display:flex;gap:20pt;margin-top:16pt;align-items:flex-end"><div style="width:.7in">${A.star()}</div><div style="width:.8in">${A.tree()}</div><div style="width:.7in">${A.gift()}</div></div>
    <p class="serif italic" style="margin-top:10pt;color:var(--berry);font-size:13pt">Signed, Juniper, Chief Sleigh Engineer</p>
  </div></section>`);

  document.getElementById('pages').innerHTML = out.join('');
})();
</script>
