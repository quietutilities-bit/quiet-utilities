<!doctype html>
<html lang="en" data-theme="christmas">
<head>
<meta charset="utf-8">
<title>Listing images</title>
<link rel="stylesheet" href="../../../_brand/brand.css">
<script src="../../../_brand/art/winter.js"></script>
<!-- Christmas Mega Bundle listing images (#1-#5, 3000x2250) and pins (#6-#7, 1000x1500).
     img/<prefix>-pNN.png are pages of the finished products: g game night, e escape room, c countdown,
     b coloring book, s santa letter, x secret santa, p planner; t-sheet.png is cropped from the tracker's listing image 02. -->
<style>
  :root { --bg: #F1F5F1; --ln: #D7E2DC; }
  html, body { margin: 0; background: var(--bg); }
  .stage { position: relative; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--ink); }
  .l { width: 3000px; height: 2250px; }
  .pin { width: 1000px; height: 1500px; }
  .sheet { position: absolute; background: #fff; box-shadow: 0 30px 70px rgba(47,93,80,.22), 0 6px 16px rgba(59,47,42,.12); border-radius: 6px; overflow: hidden; }
  .sheet img { width: 100%; display: block; }
  .t { font-family: var(--serif); font-weight: 600; line-height: 1.02; }
  .t em { font-style: italic; font-weight: 500; color: var(--berry); }
  .eyebrow { color: var(--berry); }
  .badge { display: inline-flex; align-items: center; gap: 18px; background: #fff; border: 3px solid var(--ln); border-radius: 999px; padding: 20px 40px; font-size: 50px; font-weight: 500; margin: 0 18px 22px 0; }
  .badge i { width: 24px; height: 24px; border-radius: 50%; background: var(--berry); display: inline-block; }
  .deco { position: absolute; }
  .brand { position: absolute; font-size: 40px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  ul.get { list-style: none; padding: 0; margin: 0; }
  ul.get li { font-size: 58px; padding: 24px 0; border-bottom: 3px solid var(--ln); display: flex; gap: 34px; align-items: center; }
  ul.get li b { font-family: var(--serif); font-size: 78px; color: var(--berry); min-width: 170px; }
  .step { background: #fff; border-radius: 40px; border: 3px solid var(--ln); text-align: left; display: flex; gap: 50px; align-items: center; padding: 46px 60px; }
  .step .n { flex: none; width: 130px; height: 130px; border-radius: 50%; background: var(--pine); color: #fff; font-family: var(--serif); font-size: 80px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step h3 { font-size: 76px; margin-bottom: 16px; }
  .step p { font-size: 48px; color: var(--ink-soft); line-height: 1.32; margin: 0; }
  .save { position: absolute; width: 380px; height: 380px; border-radius: 50%; background: var(--berry); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-10deg); z-index: 20; box-shadow: 0 16px 40px rgba(59,47,42,.25); }
  .save b { font-family: var(--serif); font-size: 124px; line-height: 1; }
  .save span { font-size: 40px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .file { display: flex; align-items: center; gap: 36px; background: #fff; border: 3px solid var(--ln); border-radius: 28px; padding: 28px 40px; font-size: 48px; margin-bottom: 26px; }
  .file .ic { flex: none; width: 110px; height: 110px; border-radius: 14px; background: var(--berry); color: #fff; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .file .ic.zip { background: var(--pine); } .file .ic.x { background: #3E7A4F; }
  .file small { display: block; font-size: 36px; color: var(--ink-soft); }
  .grid8 { position: absolute; left: 150px; top: 430px; width: 2700px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 56px 70px; }
  .cell { text-align: center; }
  .cell .pv { height: 570px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 26px; }
  .cell .pv .s { background: #fff; box-shadow: 0 20px 50px rgba(47,93,80,.2); border-radius: 6px; overflow: hidden; }
  .cell .pv img { display: block; width: 100%; }
  .cell h4 { font-family: var(--serif); font-size: 50px; white-space: nowrap; font-weight: 600; margin: 0 0 8px; line-height: 1.08; }
  .cell p { font-size: 38px; color: var(--ink-soft); margin: 0; }
  .lbl { position: absolute; font-family: var(--serif); font-size: 64px; font-weight: 600; text-align: center; }
  .lbl small { display: block; font-family: var(--sans); font-size: 40px; font-weight: 400; color: var(--ink-soft); margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const A = window.WINTER;
const img = (p) => `<img src="img/${p}.png">`;
const sheet = (p, x, y, w, rot = 0, z = 1) => `<div class="sheet" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);z-index:${z}">${img(p)}</div>`;
const deco = (svg, x, y, w, extra = '') => `<div class="deco" style="left:${x}px;top:${y}px;width:${w}px;${extra}">${svg}</div>`;
const brand = (x, y) => `<div class="brand" style="left:${x}px;top:${y}px">Pantry Printable Co.</div>`;
const file = (name, sub, kind = 'PDF') => `<div class="file"><div class="ic ${kind === 'ZIP' ? 'zip' : kind === 'XLSX' ? 'x' : ''}">${kind}</div><div>${name}<small>${sub}</small></div></div>`;
const cell = (p, w, name, sub) => `<div class="cell"><div class="pv"><div class="s" style="width:${w}px">${img(p)}</div></div><h4>${name}</h4><p>${sub}</p></div>`;

const V = {
  1: () => `<div class="stage l">
    ${deco(A.ornament({ color: '#B23A3A' }), 120, 90, 190)}
    ${deco(A.holly(), 2660, 1900, 260)}
    ${deco(A.snowflake(), 1650, 110, 110)}
    ${sheet('p-p01', 90, 560, 560, -12, 1)}
    ${sheet('x-p01', 330, 420, 580, -7, 2)}
    ${sheet('s-p01', 600, 330, 600, -2, 3)}
    ${sheet('b-p01', 1000, 440, 580, 6, 2)}
    ${sheet('c-p01', 1190, 640, 540, 11, 1)}
    ${sheet('e-p01', 200, 1080, 600, -6, 4)}
    ${sheet('g-p01', 760, 980, 620, 3, 5)}
    <div class="sheet" style="left:1080px;top:1560px;width:700px;transform:rotate(-3deg);z-index:6">${img('t-sheet')}</div>
    <div class="save" style="left:60px;top:1780px"><span>Save</span><b>53%</b><span style="font-size:30px;letter-spacing:.04em">8 printables</span></div>
    <div style="position:absolute;left:1900px;top:300px;width:1000px">
      <div class="eyebrow" style="font-size:46px;margin-bottom:40px">8-in-1 printable bundle</div>
      <div class="t" style="font-size:170px">Christmas<br><em>Mega Bundle</em></div>
      <p style="font-size:62px;color:var(--ink-soft);margin:56px 0 60px;line-height:1.3">Games, an escape room, kids' activities, Santa letters, Secret Santa and gift planning. The whole season in one download.</p>
      <span class="badge"><i></i>163 pages</span><span class="badge"><i></i>+ spreadsheet</span><span class="badge"><i></i>US Letter + A4</span>
    </div>
    ${brand(1910, 2100)}
  </div>`,
  2: () => `<div class="stage l">
    <div style="position:absolute;left:0;top:130px;width:3000px;text-align:center">
      <div class="eyebrow" style="font-size:46px;margin-bottom:30px">One download, 8 printables</div>
      <div class="t" style="font-size:146px">Everything in the <em>bundle</em></div>
    </div>
    <div class="grid8">
      ${cell('g-p01', 430, 'Family Game Night', '20 games · 47 pages')}
      ${cell('e-p01', 430, 'North Pole Escape Room', '10 puzzles, ages 8+ · 22 pages')}
      ${cell('c-p01', 430, 'Christmas Countdown', '24 activity cards · 23 pages')}
      ${cell('b-p01', 430, 'Bold &amp; Easy Coloring', '30 pictures · 32 pages')}
      ${cell('s-p01', 430, 'Letter from Santa Kit', 'fillable PDF · 8 pages')}
      ${cell('x-p01', 430, 'Secret Santa Kit', 'fillable PDF · 11 pages')}
      ${cell('p-p01', 430, 'Gift &amp; Budget Planner', 'print and fill · 20 pages')}
      ${cell('t-sheet', 640, 'Gift &amp; Budget Tracker', 'Google Sheets + Excel')}
    </div>
  </div>`,
  3: () => `<div class="stage l">
    <div style="position:absolute;left:0;top:130px;width:3000px;text-align:center">
      <div class="t" style="font-size:140px">From December 1st to <em>Christmas night</em></div>
    </div>
    ${sheet('g-p23', 70, 450, 680, -4, 1)}
    ${sheet('e-p05', 330, 560, 680, 3, 2)}
    ${sheet('c-p03', 1060, 450, 680, -3, 1)}
    ${sheet('b-p12', 1280, 560, 680, 3, 2)}
    ${sheet('x-p06', 2030, 450, 680, -3, 1)}
    ${sheet('p-p05', 2250, 560, 680, 4, 2)}
    <div class="lbl" style="left:200px;top:1560px;width:900px">Play together<small>game night + escape room</small></div>
    <div class="lbl" style="left:1150px;top:1560px;width:800px">Keep kids busy<small>countdown + coloring</small></div>
    <div class="lbl" style="left:2070px;top:1560px;width:820px">Get organized<small>Secret Santa + gift planning</small></div>
    ${deco(A.sprig(), 1200, 1960, 600)}
  </div>`,
  4: () => `<div class="stage l">
    ${sheet('g-p20', 2140, 200, 700, 4, 1)}
    ${sheet('s-p02', 1980, 1000, 680, -5, 2)}
    <div style="position:absolute;left:180px;top:170px;width:1700px">
      <div class="t" style="font-size:150px;margin-bottom:40px">What you <em>get</em></div>
      <ul class="get">
        <li><b>8</b>Christmas printables in one bundle</li>
        <li><b>163</b>printable pages plus a spreadsheet</li>
        <li><b>20</b>family games and a 10-puzzle escape room</li>
        <li><b>24</b>countdown cards and 30 coloring pages</li>
        <li><b>2</b>fillable kits: Santa letter + Secret Santa</li>
        <li><b>2</b>sizes: US Letter and A4</li>
      </ul>
    </div>
    ${brand(180, 2100)}
  </div>`,
  5: () => `<div class="stage l">
    <div style="position:absolute;left:0;top:150px;width:3000px;text-align:center">
      <div class="eyebrow" style="font-size:46px;margin-bottom:30px">Digital download · nothing is shipped</div>
      <div class="t" style="font-size:150px">How it <em>works</em></div>
    </div>
    <div style="position:absolute;left:170px;top:600px;width:1400px;display:grid;gap:44px">
      <div class="step"><div class="n">1</div><div><h3>Download</h3><p>Get the 5 files from your Etsy Purchases page right after checkout.</p></div></div>
      <div class="step"><div class="n">2</div><div><h3>Unzip</h3><p>Open the zip for your paper size. The Start Here page shows how.</p></div></div>
      <div class="step"><div class="n">3</div><div><h3>Print &amp; enjoy</h3><p>Print what you need at home or at a print shop, at 100%.</p></div></div>
    </div>
    <div style="position:absolute;left:1700px;top:600px;width:1150px">
      <div style="font-family:var(--serif);font-size:70px;font-weight:600;margin-bottom:36px">Your 5 files</div>
      ${file('Start Here guide', 'what\'s inside, how to open', 'PDF')}
      ${file('All 7 PDFs, US Letter', '8.5 x 11 in, one zip', 'ZIP')}
      ${file('All 7 PDFs, A4', '210 x 297 mm, one zip', 'ZIP')}
      ${file('Gift &amp; Budget Tracker', 'blank spreadsheet', 'XLSX')}
      ${file('Tracker example', 'filled-in sample', 'XLSX')}
    </div>
  </div>`,
  6: () => `<div class="stage pin">
    ${deco(A.ornament({ color: '#B23A3A' }), 50, 40, 100)}
    ${deco(A.holly(), 820, 50, 140)}
    <div style="position:absolute;left:0;top:80px;width:1000px;text-align:center">
      <div class="t" style="font-size:98px">Christmas<br><em>Mega Bundle</em></div>
      <p style="font-size:38px;color:var(--ink-soft);margin-top:24px">8 printables · 163 pages · games, kids' activities, planners</p>
    </div>
    ${sheet('s-p01', 60, 610, 360, -10, 1)}
    ${sheet('c-p01', 580, 610, 360, 10, 1)}
    ${sheet('e-p01', 130, 820, 380, -5, 2)}
    ${sheet('x-p01', 490, 820, 380, 5, 2)}
    ${sheet('g-p01', 300, 700, 400, 0, 3)}
  </div>`,
  7: () => `<div class="stage pin" style="background:#fff">
    <div style="position:absolute;left:0;top:0;width:1000px;height:430px;background:var(--pine)"></div>
    <div style="position:absolute;left:0;top:66px;width:1000px;text-align:center;color:#fff">
      <div style="font-size:34px;letter-spacing:.2em;text-transform:uppercase;font-weight:500">The whole season, printed</div>
      <div class="t" style="font-size:80px;margin-top:26px">20 games, 24 days of fun<br>&amp; a Secret Santa kit</div>
    </div>
    ${sheet('g-p23', 30, 540, 490, -4, 1)}
    ${sheet('c-p03', 480, 580, 490, 4, 2)}
    <div style="position:absolute;left:0;bottom:50px;width:1000px;text-align:center;font-size:36px;color:var(--ink-soft)">Christmas Mega Bundle · instant download</div>
  </div>`,
};
document.getElementById('root').innerHTML = V[(location.hash || '#1').slice(1)]();
</script>
</body>
</html>
