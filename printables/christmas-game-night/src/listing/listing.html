<!doctype html>
<html lang="en" data-theme="christmas">
<head>
<meta charset="utf-8">
<title>Listing images</title>
<link rel="stylesheet" href="../../../_brand/brand.css">
<script src="../../../_brand/art/winter.js"></script>
<style>
  :root { --bg: #F1F5F1; }
  html, body { margin: 0; background: var(--bg); }
  .stage { position: relative; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--ink); }
  .l { width: 3000px; height: 2250px; }
  .pin { width: 1000px; height: 1500px; }
  .sheet { position: absolute; background: #fff; box-shadow: 0 30px 70px rgba(47,93,80,.22), 0 6px 16px rgba(59,47,42,.12); border-radius: 6px; overflow: hidden; }
  .sheet img { width: 100%; display: block; }
  .t { font-family: var(--serif); font-weight: 600; line-height: 1.02; }
  .t em { font-style: italic; font-weight: 500; color: var(--berry); }
  .eyebrow { color: var(--berry); }
  .badge { display: inline-flex; align-items: center; gap: 18px; background: #fff; border: 3px solid #D7E2DC; border-radius: 999px; padding: 22px 44px; font-size: 54px; font-weight: 500; margin: 0 20px 24px 0; }
  .badge i { width: 26px; height: 26px; border-radius: 50%; background: var(--berry); display: inline-block; }
  .deco { position: absolute; }
  .brand { position: absolute; font-size: 40px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  ul.get { list-style: none; padding: 0; margin: 0; }
  ul.get li { font-size: 58px; padding: 24px 0; border-bottom: 3px solid #D7E2DC; display: flex; gap: 34px; align-items: center; }
  ul.get li b { font-family: var(--serif); font-size: 78px; color: var(--berry); min-width: 150px; }
  .step { background: #fff; border-radius: 40px; padding: 70px 60px; border: 3px solid #D7E2DC; text-align: center; }
  .step .n { width: 140px; height: 140px; border-radius: 50%; background: var(--pine); color: #fff; font-family: var(--serif); font-size: 84px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 40px; }
  .step h3 { font-size: 80px; margin-bottom: 24px; }
  .step p { font-size: 50px; color: var(--ink-soft); line-height: 1.35; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(10, auto); grid-auto-flow: column; gap: 0 90px; width: 2200px; }
  .chips span { border-bottom: 3px solid #D7E2DC; padding: 18px 0 14px; font-size: 58px; font-weight: 500; }
  .chips span b { color: var(--berry); font-family: var(--serif); display: inline-block; width: 100px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const A = window.WINTER;
const img = (p) => `<img src="img/${p}.png">`;
const sheet = (p, x, y, w, rot = 0, z = 1) => `<div class="sheet" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);z-index:${z}">${img(p)}</div>`;
const deco = (svg, x, y, w, extra = '') => `<div class="deco" style="left:${x}px;top:${y}px;width:${w}px;${extra}">${svg}</div>`;
const brand = (x, y) => `<div class="brand" style="left:${x}px;top:${y}px">Quiet Table Co.</div>`;
const GAMES = ['Gift-Reveal Scavenger Hunt', 'Christmas Bingo', 'Christmas Trivia', 'Left-Right Gift Pass', 'Charades', 'Sketch &amp; Guess', 'Would You Rather?', 'Who’s Most Likely To', 'This or That', 'Name It!', 'Christmas A to Z', '60-Second Challenges', 'Don’t Say It!', 'Guess How Many?', 'Silly Sleigh Story', 'Joke Match', 'Word Search', 'Word Scramble', 'Tic-Tac-Toe', 'Elf Name Game'];

const V = {
  1: () => `<div class="stage l">
    ${deco(A.ornament({ color: '#B23A3A' }), 130, 100, 200)}
    ${deco(A.holly(), 2650, 1880, 280)}
    ${deco(A.snowflake(), 1580, 120, 110)}
    ${sheet('p20', 330, 330, 1080, -7, 1)}
    ${sheet('p10', 560, 260, 1080, 4, 2)}
    ${sheet('p01', 420, 190, 1180, -1.5, 3)}
    <div style="position:absolute;left:1770px;top:280px;width:1140px">
      <div class="eyebrow" style="font-size:46px;margin-bottom:40px">Printable · Instant download</div>
      <div class="t" style="font-size:180px"><em>Christmas</em><br>Family Game Night</div>
      <p style="font-size:66px;color:var(--ink-soft);margin:56px 0 64px;line-height:1.3"><b style="color:var(--ink)">20 games</b> for kids &amp; adults, including a gift-reveal scavenger hunt</p>
      <span class="badge"><i></i>20 bingo cards</span><span class="badge"><i></i>30 trivia questions</span><span class="badge"><i></i>18 hunt clues</span><span class="badge"><i></i>US Letter + A4</span>
    </div>
    ${brand(1780, 2100)}
  </div>`,

  2: () => `<div class="stage l">
    ${sheet('p08', 1560, 320, 1080, 6, 1)}
    ${sheet('p04', 1220, 220, 1100, -3, 2)}
    ${sheet('p03', 2160, 1120, 700, 7, 3)}
    <div style="position:absolute;left:170px;top:330px;width:1000px">
      <div class="eyebrow" style="font-size:46px;margin-bottom:40px">Game 1 · the big finish</div>
      <div class="t" style="font-size:146px">Gift-Reveal<br><em>Scavenger Hunt</em></div>
      <p style="font-size:62px;color:var(--ink-soft);margin:56px 0;line-height:1.35">18 rhyming clue cards lead to a hidden present.</p>
      <p style="font-size:62px;color:var(--ink-soft);line-height:1.35">Host planner, write-your-own cards and “big reveal” cards for trips and gifts too big to wrap.</p>
    </div>
    ${deco(A.gift({ color: '#2F5D50' }), 200, 1760, 280)}
    ${deco(A.stocking(), 540, 1780, 210)}
    ${brand(170, 2140)}
  </div>`,

  3: () => `<div class="stage l">
    <div style="position:absolute;left:0;top:140px;width:3000px;text-align:center">
      <div class="t" style="font-size:146px">Games for the <em>whole table</em></div>
    </div>
    ${sheet('p22', 170, 500, 860, -3, 1)}
    ${sheet('p23', 640, 580, 860, 3, 2)}
    ${sheet('p28', 1260, 540, 860, -2, 3)}
    ${sheet('p42', 1980, 500, 860, 3, 4)}
    <div style="position:absolute;left:0;top:1880px;width:3000px;display:flex;justify-content:space-around;font-family:var(--serif);font-size:80px;font-weight:600">
      <span>Left-Right Gift Pass</span><span>Charades</span><span>Would You Rather</span><span>Word Search</span>
    </div>
  </div>`,

  4: () => `<div class="stage l">
    <div style="position:absolute;left:190px;top:330px;width:2620px">
      <div class="t" style="font-size:130px;margin-bottom:30px">What you <em>get</em>: 20 games, 47 pages</div>
      <div class="chips">${GAMES.map((g, i) => `<span><b>${i + 1}</b>${g}</span>`).join('')}</div>
      <div style="display:flex;gap:80px;margin-top:44px;font-size:58px">
        <div><b style="font-family:var(--serif);color:var(--berry);font-size:84px">2</b> PDFs: US Letter + A4</div>
        <div><b style="font-family:var(--serif);color:var(--berry);font-size:84px">✓</b> Answer keys included</div>
        <div><b style="font-family:var(--serif);color:var(--berry);font-size:84px">✓</b> Ages 4 to 99</div>
      </div>
    </div>
    ${deco(A.tree(), 2500, 700, 380)}${deco(A.gift({ color: "#B23A3A" }), 2520, 1340, 300)}
    ${brand(190, 2110)}
  </div>`,

  5: () => `<div class="stage l">
    <div style="position:absolute;left:0;top:200px;width:3000px;text-align:center">
      <div class="eyebrow" style="font-size:46px;margin-bottom:30px">Digital download · nothing is shipped</div>
      <div class="t" style="font-size:150px">How it <em>works</em></div>
    </div>
    <div style="position:absolute;left:200px;top:720px;width:2600px;display:grid;grid-template-columns:repeat(3,1fr);gap:80px">
      <div class="step"><div class="n">1</div><h3>Buy</h3><p>Your files are ready right after checkout.</p></div>
      <div class="step"><div class="n">2</div><h3>Download</h3><p>Get the PDFs from your Etsy Purchases page or email.</p></div>
      <div class="step"><div class="n">3</div><h3>Print &amp; play</h3><p>Print at home or at a print shop, as many copies as your family needs.</p></div>
    </div>
    <div style="position:absolute;left:0;top:1640px;width:3000px;text-align:center">
      <span class="badge"><i></i>US Letter (8.5 × 11 in)</span><span class="badge"><i></i>A4 (210 × 297 mm)</span><span class="badge"><i></i>Personal use</span>
    </div>
    ${deco(A.sprig(), 1200, 1960, 600)}
  </div>`,

  6: () => `<div class="stage pin">
    ${deco(A.ornament({ color: '#B23A3A' }), 50, 40, 100)}
    ${deco(A.holly(), 820, 50, 140)}
    <div style="position:absolute;left:0;top:80px;width:1000px;text-align:center">
      <div class="t" style="font-size:92px"><em>Christmas</em><br>Family Game Night</div>
      <p style="font-size:40px;color:var(--ink-soft);margin-top:24px">20 printable games for kids &amp; adults</p>
    </div>
    ${sheet('p10', 330, 560, 560, 6, 1)}
    ${sheet('p01', 110, 520, 560, -4, 2)}
    <div style="position:absolute;left:0;bottom:60px;width:1000px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 34px;background:var(--berry)">Printable · instant download</span></div>
  </div>`,
  7: () => `<div class="stage pin" style="background:#fff">
    <div style="position:absolute;left:0;top:0;width:1000px;height:450px;background:var(--pine)"></div>
    <div style="position:absolute;left:0;top:64px;width:1000px;text-align:center;color:#fff">
      <div style="font-size:32px;letter-spacing:.2em;text-transform:uppercase;font-weight:500">Hide the gift · follow the clues</div>
      <div class="t" style="font-size:92px;margin-top:26px">Christmas Gift<br>Scavenger Hunt</div>
    </div>
    ${sheet('p04', 180, 500, 640, -2, 1)}
    <div style="position:absolute;left:0;bottom:46px;width:1000px;text-align:center;font-size:34px;color:var(--ink-soft)">18 rhyming clues · + 19 more family games</div>
  </div>`,
};
document.getElementById('root').innerHTML = V[(location.hash || '#1').slice(1)]();
</script>
</body>
</html>
